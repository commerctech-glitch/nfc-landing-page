<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviews Quito - Placas NFC & QR para Google Maps</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #FFFFFF;
            --text-main: #0A0A0A;
            --text-muted: #6B7280;
            --border: #E5E7EB;
            --terracota: #DD5738;
            --whatsapp: #25D366;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 20px;
        }
        .logo-area { font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 8px; }
        .contacto-btn { border: 1px solid var(--border); padding: 8px 18px; border-radius: 20px; font-size: 14px; font-weight: 500; text-decoration: none; color: var(--text-main); transition: 0.2s; }
        .contacto-btn:hover { background: #F3F4F6; }

        .hero-section {
            text-align: center;
            max-width: 900px;
            margin: 20px auto 40px;
            padding: 0 20px;
        }
        .hero-section h1 { font-size: 38px; font-weight: 800; line-height: 1.2; margin-bottom: 16px; color: #111; }
        .hero-section p { font-size: 16px; color: var(--text-muted); }

        .main-grid {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            max-width: 1100px;
            margin: 0 auto 50px;
            padding: 0 20px;
            flex-wrap: wrap;
        }

        .image-preview {
            background: #F8FAFC;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            max-width: 520px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }
        .image-preview img { width: 100%; height: auto; border-radius: 8px; object-fit: cover; }

        .form-card {
            background: #FAFAFA;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }
        .input-group {
            background: #FFFFFF;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 14px;
        }
        .input-group label { display: block; font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; margin-bottom: 2px; }
        .input-group input { width: 100%; border: none; outline: none; font-size: 14px; color: var(--text-main); background: transparent; }
        
        .toggle-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #FFFFFF;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 20px;
            font-size: 13px;
            color: var(--text-muted);
        }
        .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .3s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--terracota); }
        input:checked + .slider:before { transform: translateX(18px); }

        .submit-btn {
            width: 100%;
            background-color: var(--terracota);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 12px rgba(221, 87, 56, 0.3);
            transition: 0.2s;
        }
        .submit-btn:hover { opacity: 0.9; }

        .features-footer {
            display: flex;
            justify-content: center;
            gap: 30px;
            border-top: 1px solid var(--border);
            padding: 30px 20px;
            max-width: 1000px;
            margin: 0 auto;
            color: var(--text-muted);
            font-size: 13px;
            flex-wrap: wrap;
        }
        .feature-item { display: flex; align-items: center; gap: 8px; font-weight: 500; }

        .whatsapp-float {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: var(--whatsapp);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
            text-decoration: none;
            z-index: 100;
            transition: transform 0.2s;
        }
        .whatsapp-float:hover { transform: scale(1.05); }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <span>📍</span> Reviews Quito
        </div>
        <a href="https://wa.me/593984287403" class="contacto-btn">Contacto</a>
    </header>

    <section class="hero-section">
        <h1>Tus clientes aman tu atención.<br>Haz que todo Quito lo sepa.</h1>
        <p>Consigue reseñas oficiales de Google Maps 3 veces más rápido.</p>
    </section>

    <div class="main-grid">
        <div class="image-preview">
            <!-- Imagen oficial generada del producto en mostrador -->
            <img src="./nfc.jpg" alt="Placa NFC Google Reviews en Mostrador">
        </div>

        <div class="form-card">
            <form onsubmit="enviarAWhatsApp(event)">
                <div class="input-group">
                    <label>Nombre del Negocio</label>
                    <input type="text" id="negocio" placeholder="Ej. Cafetería La Carolina" required>
                </div>
                <div class="input-group">
                    <label>WhatsApp</label>
                    <input type="tel" id="whatsapp" placeholder="Ej. 0991234567" required>
                </div>
                <div class="input-group">
                    <label>Sector (Cumbayá, La Carolina)</label>
                    <input type="text" id="sector" placeholder="Ej. La Carolina" required>
                </div>
                <div class="toggle-group">
                    <span>¿Ya tienes perfil en Google Maps?</span>
                    <label class="switch">
                        <input type="checkbox" id="googleMapsStatus">
                        <span class="slider"></span>
                    </label>
                </div>
                <button type="submit" class="submit-btn">Reservar mi placa y registrarse<br><span style="font-size: 9px; opacity: 0.85; font-weight: normal;">(Pre-orden sin compromiso)</span></button>
            </form>
        </div>
    </div>

    <div class="features-footer">
        <div class="feature-item">📱 Chip NFC & QR</div>
        <div class="feature-item">⭐ Confianza Google</div>
        <div class="feature-item">📈 Crecimiento Local</div>
        <div class="feature-item">🛡️ Garantía</div>
    </div>

    <a href="https://wa.me/593984287403" class="whatsapp-float" target="_blank" title="Escríbenos por WhatsApp">💬</a>

    <script>
        function enviarAWhatsApp(event) {
            event.preventDefault();
            const telefono = "593984287403";
            const negocio = document.getElementById('negocio').value;
            const wapp = document.getElementById('whatsapp').value;
            const sector = document.getElementById('sector').value;
            const tieneMaps = document.getElementById('googleMapsStatus').checked ? "Sí" : "No";
            
            const mensaje = `Hola, quiero reservar una placa NFC:%0A*Negocio:* ${negocio}%0A*WhatsApp:* ${wapp}%0A*Sector:* ${sector}%0A*Tiene Google Maps:* ${tieneMaps}`;
            window.open(`https://wa.me/${telefono}?text=${mensaje}`, '_blank');
        }
    </script>
</body>
</html>
